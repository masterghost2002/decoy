<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decoy fixture</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #0f172a;
        --paper: #ffffff;
        --line: #cbd5e1;
        --dim: #64748b;
        --pass: #15803d;
        --fail: #dc2626;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e2e8f0;
          --paper: #0b1120;
          --line: #334155;
          --dim: #94a3b8;
          --pass: #4ade80;
          --fail: #f87171;
        }
      }

      body {
        margin: 0;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      main {
        max-width: 60rem;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.125rem;
      }

      p {
        margin: 0 0 1rem;
        color: var(--dim);
      }

      button {
        padding: 0.4rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 0.375rem;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #output {
        margin-top: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }

      .row {
        padding: 0.35rem 0;
        border-bottom: 1px solid var(--line);
      }

      .pass {
        color: var(--pass);
      }

      .fail {
        color: var(--fail);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Decoy fixture page</h1>
      <p>
        Exercises fetch and XMLHttpRequest against the rule set seeded by
        <code>pnpm --filter @mocksmith/extension e2e</code>. Load the extension, seed those rules,
        then run the checks.
      </p>
      <button id="run" type="button">Run checks</button>
      <div id="output"></div>
    </main>
    <script src="./scenarios.js"></script>
  </body>
</html>
